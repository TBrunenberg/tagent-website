s_a531446c:
  t_df93e41ffd: Privacy*verklaring.*
  t_f731694208: 'Hoe Tagent omgaat met gegevens van bezoekers en klanten. Laatst bijgewerkt: 22 november 2026.'
s_cff3596b:
  t_e0f6fb241f: Wie we zijn
  t_0818db7e1e: Tagent ontwerpt, bouwt en beheert websites voor ondernemers in Utrecht en omstreken. Vragen over privacy? Mail naar {email} of bel {telefoon}.
  t_071f60ce1e: Welke gegevens
  t_e7472c9180: 'Bij een aanvraag via het kennismakingsformulier: naam, telefoonnummer en/of e-mailadres, het onderwerp, het doel en (als ingevuld) de link van de huidige website. Bij contact per e-mail of telefoon: de gegevens die daarin worden gedeeld.'
  t_a2a46037f8: Waarvoor
  t_e553c21f74: Alleen om contact op te nemen over de aanvraag en, bij een samenwerking, om de afspraken uit te voeren en te factureren. Gegevens worden niet gebruikt voor nieuwsbrieven of reclame.
  t_1871a6ede6: Grondslag
  t_cdae67ca0f: Het verwerken gebeurt op basis van de aanvraag zelf (het voorbereiden van een overeenkomst) en, bij een samenwerking, de uitvoering van die overeenkomst en wettelijke verplichtingen zoals de administratie.
  t_eebf281046: Hoe lang
  t_72a1f6234d: Aanvragen zonder samenwerking worden na 12 maanden verwijderd. Bij een samenwerking blijven gegevens bewaard zolang dat nodig is voor de afspraken. Gegevens voor de administratie worden 7 jaar bewaard, zoals de wet voorschrijft.
  t_738a2f4148: Delen met anderen
  t_e168875607: Gegevens worden niet verkocht. Het formulier wordt verstuurd via Web3Forms, dat de aanvraag doorstuurt naar {email}. De website draait op GitHub Pages. Met deze diensten worden alleen de gegevens gedeeld die daarvoor nodig zijn.
  t_cffebba574: Cookies
  t_1944db2c06: De website gebruikt geen tracking- of advertentiecookies en houdt geen bezoekersstatistieken bij.
  t_cf142249fa: Lettertypes
  t_ab5452780d: De lettertypes worden vanaf de eigen website geladen. Daarbij gaan er geen gegevens naar Google Fonts of andere partijen.
  t_bccea08167: Rechten
  t_ce4c81bcb8: Gegevens zijn altijd in te zien, aan te passen of te laten verwijderen via {email}. Een klacht kan ook worden ingediend bij de Autoriteit Persoonsgegevens.
seo:
  titel: Privacyverklaring | Tagent
  omschrijving: 'Hoe Tagent omgaat met gegevens van bezoekers en klanten: welke gegevens, waarvoor, hoe lang en welke rechten er zijn.'
