s_a531446c:
  t_df93e41ffd: Privacy*verklaring.*
  t_f731694208: 'Hoe Tagent omgaat met gegevens van bezoekers en klanten. Laatst bijgewerkt: 22 november 2026.'
s_cff3596b:
  t_e0f6fb241f: Wie we zijn
  t_0818db7e1e: Tagent ontwerpt, bouwt en beheert websites voor ondernemers in Utrecht en omstreken. Vragen over privacy? Mail naar {email} of bel {telefoon}.
  t_071f60ce1e: Welke gegevens
  t_e7472c9180: 'Bij een aanvraag via het kennismakingsformulier: naam, telefoonnummer en/of e-mailadres, het onderwerp, het doel en (als ingevuld) de link van de huidige website. Bij contact per e-mail of telefoon: de gegevens die daarin worden gedeeld.'
  t_a2a46037f8: Waarvoor
  t_e553c21f74: Alleen om contact op te nemen over de aanvraag en, bij een samenwerking, om de afspraken uit te voeren en te factureren. Gegevens worden niet gebruikt voor nieuwsbrieven of reclame.
  t_1871a6ede6: Grondslag
  t_cdae67ca0f: Het verwerken gebeurt op basis van de aanvraag zelf (het voorbereiden van een overeenkomst) en, bij een samenwerking, de uitvoering van die overeenkomst en wettelijke verplichtingen zoals de administratie.
  t_eebf281046: Hoe lang
  t_72a1f6234d: Aanvragen zonder samenwerking worden na 12 maanden verwijderd. Bij een samenwerking blijven gegevens bewaard zolang dat nodig is voor de afspraken. Gegevens voor de administratie worden 7 jaar bewaard, zoals de wet voorschrijft.
  t_738a2f4148: Delen met anderen
  t_e168875607: Gegevens worden niet verkocht. Het formulier wordt verstuurd via Web3Forms, dat de aanvraag doorstuurt naar {email}. De website draait op GitHub Pages. Met deze diensten worden alleen de gegevens gedeeld die daarvoor nodig zijn.
  t_cffebba574: Cookies
  t_1944db2c06: De website gebruikt geen tracking- of advertentiecookies en houdt geen bezoekersstatistieken bij.
  t_cf142249fa: Lettertypes
  t_ab5452780d: De lettertypes worden vanaf de eigen website geladen. Daarbij gaan er geen gegevens naar Google Fonts of andere partijen.
  t_bccea08167: Rechten
  t_ce4c81bcb8: Gegevens zijn altijd in te zien, aan te passen of te laten verwijderen via {email}. Een klacht kan ook worden ingediend bij de Autoriteit Persoonsgegevens.
  t_7e21df2131: Tagent ontwerpt, bouwt en beheert websites voor ondernemers in Utrecht en omstreken. Verantwoordelijk voor de verwerking van persoonsgegevens is Tygo Brunenberg, handelend onder de naam Tagent. Tagent gaat zorgvuldig om met persoonsgegevens. Andere vragen over privacy? Mail naar
  t_6501a000c8: .
  t_d76c4eab5f: 'Bij een aanvraag via het kennismakingsformulier verwerken we de gegevens die je invult: je naam, telefoonnummer en/of e-mailadres, het onderwerp, het doel en eventueel de link naar je huidige website. Bij contact via e-mail of telefoon verwerken we de gegevens die je zelf met ons deelt. Daarnaast worden technische gegevens verwerkt die nodig zijn om de website te laten werken en te beveiligen.'
  t_0a153f1b60: Persoonsgegevens worden alleen gebruikt om contact op te nemen naar aanleiding van een aanvraag, om een eventuele samenwerking voor te bereiden en uit te voeren, om afspraken, facturatie en de wettelijke administratie af te handelen en om de website veilig en goed te laten werken. Gegevens worden niet gebruikt voor nieuwsbrieven of reclame.
  t_65925d82ef: Persoonsgegevens worden verwerkt als dat nodig is om op jouw verzoek een overeenkomst voor te bereiden, een overeenkomst uit te voeren of te voldoen aan wettelijke verplichtingen. De anonieme bezoekersstatistieken gebruiken we op basis van ons gerechtvaardigd belang om de website te verbeteren.
  t_53f80c0358: Aanvragen waarbij geen samenwerking ontstaat, worden na maximaal 12 maanden verwijderd. Bij een samenwerking worden gegevens bewaard zolang dat nodig is voor de uitvoering van de afspraken. Gegevens die onderdeel zijn van de financiële administratie worden 7 jaar bewaard, zoals de wet voorschrijft.
  t_670b879240: Kennismakingsformulier
  t_c290d76622: Het formulier wordt verstuurd via Web3Forms (Web3Creative, India). Web3Forms ontvangt de ingevulde gegevens, je IP-adres en technische gegevens van je browser, controleert de aanvraag op spam en stuurt hem per e-mail door naar {email}. Web3Forms bewaart verzonden formulieren volgens zijn eigen voorwaarden en werkt daarvoor met eigen dienstverleners, ook buiten de Europese Economische Ruimte. Voor die doorgifte gelden de standaardcontractbepalingen van de Europese Commissie.
  t_72057126f3: Bezoekersstatistieken
  t_b7efa2e5e5: We gebruiken Cloudflare Web Analytics om te zien hoe vaak pagina's worden bekeken en hoe snel ze laden. Daarbij worden het bezochte paginapad, de verwijzende website, het land, het type apparaat, de browser, het besturingssysteem en laadtijden verwerkt. Je IP-adres wordt niet opgeslagen, er worden geen cookies of andere gegevens op je apparaat geplaatst en bezoekers worden niet gevolgd of herkend. We zien alleen totalen, geen individuele bezoekers.
  t_a2edeb6b57: Persoonsgegevens worden niet verkocht of gedeeld voor commerciële doeleinden. Naast Web3Forms en Cloudflare maken we gebruik van een hostingpartij voor de website en een e-mailprovider. Deze partijen verwerken alleen de gegevens die nodig zijn voor hun dienstverlening. Worden persoonsgegevens buiten de Europese Economische Ruimte verwerkt, dan zorgen we dat daarvoor passende wettelijke waarborgen gelden.
  t_03bc2f0aaf: De website gebruikt geen tracking- of advertentiecookies en toont daarom geen cookiemelding. Functionele technieken worden alleen gebruikt als ze nodig zijn om de website goed te laten werken, zoals het tijdelijk onthouden van een paginaovergang tijdens je bezoek.
  t_d6f1421f66: Je hebt het recht om je persoonsgegevens in te zien, te laten corrigeren of, als dat mogelijk is, te laten verwijderen. Ook kun je in bepaalde gevallen bezwaar maken tegen de verwerking of vragen om die tijdelijk te beperken. Wil je gebruikmaken van je privacyrechten? Neem dan contact op via
  t_ebe9a15211: . Je hebt daarnaast het recht om een klacht in te dienen bij de Autoriteit Persoonsgegevens.
seo:
  titel: Privacyverklaring | Tagent
  omschrijving: 'Hoe Tagent omgaat met gegevens van bezoekers en klanten: welke gegevens, waarvoor, hoe lang en welke rechten er zijn.'
