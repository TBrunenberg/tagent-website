  t_33d5db0dc8: Eerst zien,
  t_0519baabd4: dan *beslissen.*
  t_457a531b3d: Een eerste ontwerp op maat, gemaakt voor uw zaak. Bekijken, bespreken en pas dan beslissen.
s_33add96b:
  t_030cf7ca4d: Van gesprek tot *live.*
  t_e06822f5cc: '01'
  t_a1d3641791: Kennismaking
  t_edd263a3e8: Een gesprek over het bedrijf, de klanten en de huidige site. Wat werkt goed, wat mist er, en wat moet zelf aan te passen zijn?
  t_04f5af4122: Plan een kennismaking
  t_7f7224f803: '02'
  t_cf3be58bba: Ontwerp
  t_77c5de40bb: 'Een ontwerp op basis van de huidige site en huisstijl: kleuren, lettertypes, eigen foto''s en eigen teksten. Alle benodigde pagina''s en links gaan mee.'
  t_24f6f18fa6: '03'
  t_5501f7b902: Samen doorlopen
  t_2f56be1dcb: Het ontwerp wordt samen doorgelopen en bijgeschaafd tot alles naar wens is. Pas dan volgt het akkoord.
  t_3f935c49f3: '04'
  t_109661edb7: Beheerscherm en livegang
  t_cb844d467b: Na akkoord krijgt de site een beheerscherm in dezelfde lay-out. Daarna gaat hij online op het eigen domein, met de afspraken vastgelegd in een overeenkomst.
  t_777f152511: Over het beheerscherm
  t_337c5aeaf2: '05'
  t_1ab501189e: Beheer
  t_a50e1c661f: 'Beheer per maand of per jaar, met hulp bij aanpassingen, nieuwe pagina''s en functies. Zonder beheer kan ook: dan is het de website met beheerscherm, zonder maand- of jaarkosten.'
  t_50fd0037e9: Over beheer
s_d1d73b73:
  t_63b60d79d5: Goed om te *weten.*
  t_0750848a64: Staat een vraag er niet tussen? Stel hem gerust in de kennismaking.
  t_079c6466c2: Wat kost een website?
  t_f23ea5c0a2: Dat hangt af van het aantal pagina's en wat erin moet. Na de kennismaking volgt een voorstel met een prijs op maat.
  t_2174936537: Hoe lang duurt het?
  t_d1f8e95ad9: Dat hangt af van de omvang en van het samen doorlopen van het ontwerp. Doorgaans staat een website binnen twee weken online. De planning wordt in de kennismaking afgesproken.
  t_598bd617cc: Is beheer verplicht?
  t_bfec8acb77: Nee. Alleen de website met beheerscherm afnemen kan ook, zonder maand- of jaarkosten. Met beheer helpt Tagent bij het aanpassen, opstellen en toevoegen van pagina's en functies.
  t_52e7784cb2: Wat is er nodig om te starten?
  t_c676dbd2c4: De link van de huidige site (als die er is), het logo, foto's en de wensen. Teksten van de huidige site kunnen meeverhuizen, indien gewenst.
  t_3c951bc29f: Is de site zelf aan te passen?
  t_e98bae7ce2: Ja. Via het beheerscherm zijn teksten, foto's en openingstijden aan te passen en pagina's aan of uit te zetten. De lay-out blijft vast, zodat alles strak blijft.
  t_e9d2b4a38d: Van wie is het domein?
  t_1d47084adf: Van het bedrijf zelf. Het domein blijft op eigen naam, en de kosten daarvan ook. Vaak is er al een domein.
  t_8b4a6bf2dc: Wat gebeurt er bij stoppen met beheer?
  t_b5f2005269: Dan wordt de site overgedragen.
  t_4781a14804: Blijft het reserveringssysteem werken?
  t_3be55c73d2: Bestaande reserverings- en boekingsmodules worden overgenomen met dezelfde koppeling. Niets hoeft opnieuw te worden ingericht.
  t_8c34ddc6fe: Werken oude links nog?
  t_a2c4e4f1a0: Ja. Oude adressen blijven gelijk of worden doorgestuurd naar de nieuwe pagina. Links vanuit Google, social media en flyers blijven werken.
  t_66c705a8fb: Werkt de site op een telefoon?
  t_3535a34426: Ja, elke pagina is ontworpen voor telefoon, tablet en laptop.
